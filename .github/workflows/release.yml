name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v2.2.0). Defaults to the current ref.
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use the workflow revision (selected branch on dispatch), not the
          # release tag. Tag v2.2.0 still points at a commit that always
          # npm-publishes and cannot skip an already-published version.
      
      - name: Setup and cache dependencies
        uses: ./.github/actions/setup-and-cache

      # Do not set setup-node `registry-url` here: it writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and an empty
      # token blocks the trusted-publisher OIDC exchange (ENEEDAUTH / 404).

      - name: Ensure npm CLI for trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Changelog
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Skipping changelog: '$RELEASE_TAG' is not a version tag"
            exit 0
          fi
          pnpm dlx changelogithub --draft --to "$RELEASE_TAG"

      - name: Publish npm
        # Trusted publisher OIDC — do not set NODE_AUTH_TOKEN / NPM_TOKEN.
        run: pnpm publish-ci ${{ inputs.tag || github.ref_name }} --npm-only

      - name: Publish JSR
        # OIDC uses the user who triggered the workflow. If JSR is set to
        # "restrict publishing to scope members" (default), that user must
        # be a member of @josh-hemphill, or set the JSR_TOKEN secret.
        run: pnpm publish-ci ${{ inputs.tag || github.ref_name }} --jsr-only
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
