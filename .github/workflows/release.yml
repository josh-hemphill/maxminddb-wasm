name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup and cache dependencies
        uses: ./.github/actions/setup-and-cache

      # Do not set setup-node `registry-url` here: it writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and an empty
      # token blocks the trusted-publisher OIDC exchange (ENEEDAUTH / 404).

      - name: Ensure npm CLI for trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts
          path: .

      - name: Changelog
        run: pnpm dlx changelogithub --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm and JSR
        # Trusted publisher OIDC — do not set NODE_AUTH_TOKEN / NPM_TOKEN.
        run: pnpm publish-ci ${{ github.ref_name }}
